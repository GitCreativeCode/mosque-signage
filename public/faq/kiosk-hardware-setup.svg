<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Background -->
  <rect width="960" height="540" fill="#0f172a" rx="16"/>
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Technical Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-transform="uppercase">HARDWARE TOPOLOGY SPECIFICATION</text>
    <text x="0" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Windows Extended Desktop Kiosk Setup</text>
    <text x="0" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Dual-display configuration powering admin desk control and automated 1080p kiosk broadcast.</text>
  </g>

  <!-- Monitor 1: Admin Workstation -->
  <g transform="translate(60, 145)">
    <!-- Outer Enclosure -->
    <rect width="360" height="250" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Screen Bezel -->
    <rect x="20" y="20" width="320" height="170" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
    
    <!-- Browser Header Bar -->
    <rect x="20" y="20" width="320" height="26" fill="#0f172a" rx="6"/>
    <circle cx="36" cy="33" r="3.5" fill="#475569"/>
    <circle cx="48" cy="33" r="3.5" fill="#475569"/>
    <circle cx="60" cy="33" r="3.5" fill="#475569"/>
    <text x="80" y="37" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MosqueSignage Admin (/admin)</text>

    <!-- Admin Content Blocks -->
    <rect x="35" y="60" width="135" height="45" rx="6" fill="#1e293b"/>
    <rect x="190" y="60" width="135" height="45" rx="6" fill="#1e293b"/>
    <rect x="35" y="120" width="290" height="55" rx="6" fill="#1e293b"/>

    <!-- Desk Stand -->
    <path d="M 165 190 L 160 225 L 200 225 L 195 190 Z" fill="#334155"/>
    <rect x="140" y="225" width="80" height="6" rx="3" fill="#475569"/>

    <!-- Description Label -->
    <text x="20" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MONITOR 1 (Desk)</text>
    <text x="20" y="232" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Primary Display (Admin Desk)</text>
  </g>

  <!-- Connecting HDMI Cable -->
  <g>
    <path d="M 420 270 L 540 270" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4"/>
    <rect x="445" y="245" width="70" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="480" y="268" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">HDMI 2.0</text>
    <text x="480" y="284" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">1080p 60Hz</text>
  </g>

  <!-- Monitor 2: Prayer Hall TV -->
  <g transform="translate(540, 145)">
    <!-- Outer Enclosure -->
    <rect width="360" height="250" rx="12" fill="#1e293b" stroke="#15803d" stroke-width="1.5"/>
    <!-- Screen Bezel -->
    <rect x="20" y="20" width="320" height="170" rx="6" fill="#020617" stroke="#166534" stroke-width="1"/>

    <!-- Kiosk Top Bar -->
    <rect x="20" y="20" width="320" height="22" fill="#14532d"/>
    <text x="32" y="35" fill="#86efac" font-family="system-ui, sans-serif" font-size="9" font-weight="700">12:45 PM • Fajr 05:42 • Dhuhr 01:15</text>

    <!-- Kiosk Slide Canvas -->
    <rect x="30" y="50" width="205" height="130" rx="4" fill="#0f172a"/>
    <text x="132" y="115" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Community Poster Slide</text>
    <rect x="38" y="145" width="28" height="28" rx="3" fill="#f8fafc"/>
    <rect x="42" y="149" width="20" height="20" fill="#020617"/>

    <!-- Prayer Timetable Drawer (Pinned/Sliding) -->
    <rect x="245" y="48" width="90" height="138" fill="#14532d" fill-opacity="0.6" stroke="#15803d" stroke-width="1"/>
    <text x="290" y="68" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="800">TIMETABLE</text>
    <text x="290" y="88" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">Fajr 05:42</text>
    <text x="290" y="104" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">Dhuhr 01:15</text>
    <text x="290" y="120" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">Asr 04:30</text>
    <text x="290" y="136" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">Maghrib 06:12</text>
    <text x="290" y="152" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">Isha 07:45</text>

    <!-- Wall Mount Bracket -->
    <rect x="155" y="195" width="50" height="20" rx="4" fill="#334155"/>
    <line x1="180" y1="215" x2="180" y2="235" stroke="#475569" stroke-width="5"/>

    <!-- Description Label -->
    <text x="20" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MONITOR 2 (Prayer Hall TV)</text>
    <text x="20" y="232" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11">1920x1080 @ 100% Scale (--kiosk)</text>
  </g>

  <!-- Technical Settings Bar -->
  <g transform="translate(60, 435)">
    <rect width="840" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Windows Display Settings:</text>
    <text x="25" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Press <tspan fill="#38bdf8" font-weight="700">Win + P</tspan> &gt; Choose <tspan fill="#38bdf8" font-weight="700">Extend</tspan> &gt; Set Monitor 2 to <tspan fill="#4ade80" font-weight="700">1920x1080, 100% Scale</tspan> &gt; Execute <tspan fill="#94a3b8" font-family="monospace">scripts\setup-autostart.ps1</tspan></text>
  </g>
</svg>
