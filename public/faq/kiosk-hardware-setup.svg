<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Background -->
  <rect width="960" height="540" fill="#0f172a" rx="16"/>
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Technical Header -->
  <g transform="translate(60, 38)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">HARDWARE &amp; OS TOPOLOGY SPECIFICATION</text>
    <text x="0" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Display Hardware &amp; Network Deployment Topologies</text>
    <text x="0" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Works on Windows, Linux, and macOS. Use any browser (Edge or Chrome recommended for kiosk mode).</text>
  </g>

  <!-- Left Half: Topology A (Direct HDMI Extended Desktop) -->
  <g transform="translate(60, 112)">
    <!-- Container Box -->
    <rect width="405" height="325" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="18" y="16" width="175" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="105" y="32" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">TOPOLOGY A: DIRECT HDMI</text>

    <!-- Monitor 1: Admin Workstation -->
    <g transform="translate(25, 52)">
      <rect width="150" height="105" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <rect x="0" y="0" width="150" height="18" rx="6" fill="#1e293b"/>
      <circle cx="10" cy="9" r="2.5" fill="#ef4444"/>
      <circle cx="18" cy="9" r="2.5" fill="#f59e0b"/>
      <circle cx="26" cy="9" r="2.5" fill="#10b981"/>
      <text x="40" y="12" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600">Admin (/admin)</text>
      <!-- Content Blocks -->
      <rect x="10" y="26" width="60" height="20" rx="3" fill="#1e293b"/>
      <rect x="78" y="26" width="62" height="20" rx="3" fill="#1e293b"/>
      <rect x="10" y="52" width="130" height="42" rx="3" fill="#1e293b"/>
      <text x="75" y="76" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7">PIN or Username+Pass</text>
      <!-- Stand -->
      <path d="M 68 105 L 65 125 L 85 125 L 82 105 Z" fill="#334155"/>
      <rect x="55" y="125" width="40" height="4" rx="2" fill="#475569"/>
      <text x="75" y="145" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Monitor 1 (Desk)</text>
    </g>

    <!-- Cable -->
    <g transform="translate(182, 102)">
      <path d="M 0 0 L 40 0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 3"/>
      <rect x="8" y="-12" width="24" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="20" y="4" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">HDMI</text>
    </g>

    <!-- Monitor 2: Prayer Hall TV -->
    <g transform="translate(230, 52)">
      <rect width="150" height="105" rx="6" fill="#020617" stroke="#15803d" stroke-width="1.5"/>
      <rect x="0" y="0" width="150" height="14" fill="#14532d"/>
      <text x="8" y="10" fill="#86efac" font-family="system-ui, sans-serif" font-size="7" font-weight="700">12:45 PM • Fajr 05:42</text>
      <!-- Slide Area -->
      <rect x="8" y="20" width="85" height="75" rx="2" fill="#0f172a"/>
      <text x="50" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Flyer Slide</text>
      <!-- Timetable Drawer -->
      <rect x="98" y="20" width="44" height="75" rx="2" fill="#14532d" fill-opacity="0.8"/>
      <text x="120" y="32" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700">PRAYERS</text>
      <!-- Stand / Mount -->
      <rect x="65" y="105" width="20" height="15" fill="#334155"/>
      <text x="75" y="145" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Monitor 2 (TV)</text>
    </g>

    <!-- Summary Box -->
    <rect x="18" y="220" width="369" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="238" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Extended Desktop &amp; Autostart Setup:</text>
    <text x="30" y="255" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• <tspan fill="#38bdf8" font-weight="600">Windows:</tspan> Extend mode &gt; <tspan fill="#38bdf8" font-family="monospace">npm run autostart -- --display</tspan></text>
    <text x="30" y="271" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• <tspan fill="#10b981" font-weight="600">Linux / Pi:</tspan> Chromium autostart in <tspan font-family="monospace">~/.config/autostart</tspan></text>
    <text x="30" y="287" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• <tspan fill="#e2e8f0" font-weight="600">macOS:</tspan> Displays Extended &gt; Login Items with Chrome kiosk</text>
  </g>

  <!-- Right Half: Topology B (LAN Network Display / Smart TV / Mini-PC) -->
  <g transform="translate(495, 112)">
    <!-- Container Box -->
    <rect width="405" height="325" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#15803d" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="18" y="16" width="205" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="32" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="700">TOPOLOGY B: LAN &amp; SMART TV</text>

    <!-- Mosque Server / Office PC -->
    <g transform="translate(25, 52)">
      <rect width="115" height="105" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <rect x="15" y="25" width="85" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="33" r="3" fill="#10b981"/>
      <rect x="15" y="50" width="85" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="58" r="3" fill="#10b981"/>
      <rect x="15" y="75" width="85" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="83" r="3" fill="#38bdf8"/>
      <text x="57" y="145" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Host Server / PC</text>
      <text x="57" y="158" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Win / Mac / Linux</text>
    </g>

    <!-- Wi-Fi / LAN Router Cloud -->
    <g transform="translate(152, 87)">
      <circle cx="26" cy="18" r="22" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="26" y="16" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Wi-Fi / LAN</text>
      <text x="26" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7">Router</text>
      <!-- Dashed connections -->
      <line x1="-10" y1="18" x2="4" y2="18" stroke="#10b981" stroke-width="2" stroke-dasharray="3 2"/>
      <line x1="48" y1="18" x2="68" y2="18" stroke="#10b981" stroke-width="2" stroke-dasharray="3 2"/>
    </g>

    <!-- Dedicated Display / Smart TV -->
    <g transform="translate(230, 52)">
      <rect width="150" height="105" rx="6" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="150" height="14" fill="#064e3b"/>
      <text x="8" y="10" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="7" font-weight="700">12:45 PM • Fajr 05:42</text>
      <!-- Screen presentation -->
      <rect x="8" y="20" width="134" height="75" rx="2" fill="#0f172a"/>
      <text x="75" y="48" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">Standalone PWA / TV</text>
      <text x="75" y="62" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="7.5">Raspberry Pi / N100 / Smart TV</text>
      <text x="75" y="74" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="6.8">http://[host-ip]:3000/display</text>
      <rect x="25" y="81" width="100" height="10" rx="3" fill="#14532d"/>
      <text x="75" y="89" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="6.5">Pair Code: 6-Chars</text>
      <!-- Wall Mount -->
      <rect x="65" y="105" width="20" height="15" fill="#334155"/>
      <text x="75" y="145" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Remote TV Display</text>
    </g>

    <!-- Summary Box -->
    <rect x="18" y="220" width="369" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="238" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Network Kiosk &amp; PWA Setup:</text>
    <text x="30" y="255" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• <tspan fill="#4ade80" font-weight="600">Smart TV / Tablet:</tspan> Install PWA directly via browser URL bar.</text>
    <text x="30" y="271" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• <tspan fill="#38bdf8" font-weight="600">Admin Login:</tspan> 4–8 Digit PIN or Username + Password.</text>
    <text x="30" y="287" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">• <tspan fill="#fbbf24" font-weight="600">Protected Mode:</tspan> Pair TV screen with a 6-character code (1-yr session).</text>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(60, 452)">
    <rect width="840" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Zero Cloud Dependencies: Runs <tspan fill="#4ade80" font-weight="600">100% locally on your venue network</tspan> across Windows, Linux, and macOS with offline caching, local SQLite WAL storage, and automatic recovery.</text>
  </g>
</svg>
