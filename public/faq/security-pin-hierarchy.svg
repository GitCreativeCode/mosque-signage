<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Background -->
  <rect width="960" height="540" fill="#0f172a" rx="16"/>
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Technical Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SECURITY ARCHITECTURE SPECIFICATION</text>
    <text x="0" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Administrative Authentication Security &amp; Lockout Defense</text>
    <text x="0" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Dual credential modes (PIN &amp; Password), 100k-round PBKDF2 cryptography, dual rate-limiting, and CLI recovery.</text>
  </g>

  <!-- 3 Security Pillars -->
  <g transform="translate(60, 125)">
    <!-- Pillar 1: Cryptography & Dual-Mode Credentials -->
    <g transform="translate(0, 0)">
      <rect width="260" height="280" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <rect width="260" height="34" rx="10" fill="#0f172a"/>
      <text x="130" y="22" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">1. DUAL-MODE CREDENTIALS</text>

      <text x="18" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Tactile PIN (4–8 Digits)</text>
      <text x="18" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Designed for lobby touchscreen entry</text>

      <text x="18" y="100" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Username + Password</text>
      <text x="18" y="116" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">8+ chars (upper, number &amp; symbol)</text>

      <rect x="15" y="132" width="230" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="130" y="152" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">100,000 PBKDF2 Rounds</text>
      <text x="130" y="170" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="8.5">salt = randomBytes(16)</text>

      <text x="18" y="206" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">HMAC-Signed Session Cookies</text>
      <rect x="15" y="218" width="230" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="130" y="236" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9">data/.session_secret</text>
      <text x="130" y="250" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Zero plaintext stored</text>
    </g>

    <!-- Pillar 2: Dual Brute-Force Rate Limiting -->
    <g transform="translate(290, 0)">
      <rect width="260" height="280" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="260" height="34" rx="10" fill="#451a03"/>
      <text x="130" y="22" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">2. BRUTE-FORCE DEFENSE</text>

      <text x="18" y="58" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Per-Client Rate Limiter</text>
      <text x="18" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">
        <tspan x="18" dy="0">5 failed attempts from an IP</tspan>
        <tspan x="18" dy="15">triggers a 30-second lockout.</tspan>
      </text>

      <text x="18" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Appliance Global Lockout</text>
      <text x="18" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">
        <tspan x="18" dy="0">10 cumulative failures across</tspan>
        <tspan x="18" dy="15">all IPs locks the whole appliance.</tspan>
      </text>

      <rect x="15" y="200" width="230" height="60" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
      <text x="130" y="224" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Automatic Fail-Closed Lock</text>
      <text x="130" y="242" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Dynamic timer feedback on screen</text>
    </g>

    <!-- Pillar 3: Emergency Terminal CLI -->
    <g transform="translate(580, 0)">
      <rect width="260" height="280" rx="10" fill="#1e293b" stroke="#15803d" stroke-width="1.5"/>
      <rect width="260" height="34" rx="10" fill="#14532d"/>
      <text x="130" y="22" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">3. EMERGENCY CLI RECOVERY</text>

      <text x="18" y="58" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Forgotten PIN or Password?</text>
      <text x="18" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">
        <tspan x="18" dy="0">Host terminal access provides</tspan>
        <tspan x="18" dy="15">immediate offline database reset:</tspan>
      </text>

      <rect x="15" y="115" width="230" height="36" rx="6" fill="#052e16" stroke="#15803d" stroke-width="1"/>
      <text x="130" y="138" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11" font-weight="700">npm run reset-auth</text>

      <text x="18" y="176" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">
        <tspan x="18" dy="0">• PIN Mode: prompts for new 4–8 digit PIN</tspan>
        <tspan x="18" dy="17">• Password Mode: updates pass or switches mode</tspan>
        <tspan x="18" dy="17">• Clears all lockout counters immediately</tspan>
        <tspan x="18" dy="17">• Updates SQLite with salted PBKDF2 hash</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(60, 440)">
    <rect width="840" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Appliance Access Invariant:</text>
    <text x="25" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">The display kiosk operates in read-only presentation mode with zero interactive inputs exposed to congregation members or visitors.</text>
  </g>
</svg>
