<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Background -->
  <rect width="960" height="540" fill="#0f172a" rx="16"/>
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Technical Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SECURITY SPECIFICATION</text>
    <text x="0" y="30" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Administrative PIN Security &amp; Lockout Defense</text>
    <text x="0" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">PBKDF2 cryptography, dual-tier brute-force IP rate limiting, and emergency terminal recovery.</text>
  </g>

  <!-- 3 Security Pillars -->
  <g transform="translate(60, 135)">
    <!-- Pillar 1: Cryptography -->
    <g transform="translate(0, 0)">
      <rect width="260" height="265" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <rect width="260" height="34" rx="10" fill="#0f172a"/>
      <text x="130" y="22" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. PBKDF2 CRYPTOGRAPHY</text>

      <text x="18" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100,000 SHA-512 Rounds</text>
      <text x="18" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Salted PBKDF2 key derivation:</text>

      <rect x="15" y="88" width="230" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="25" y="107" fill="#cbd5e1" font-family="monospace" font-size="9.5">salt = randomBytes(16)</text>
      <text x="25" y="123" fill="#94a3b8" font-family="monospace" font-size="9.5">hash = pbkdf2(pin, 100k)</text>

      <text x="18" y="157" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HMAC Session Cookies</text>
      <text x="18" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
        <tspan x="18" dy="0">Signed HTTP-only cookie using</tspan>
        <tspan x="18" dy="15">random 32-byte secret in:</tspan>
      </text>

      <rect x="15" y="206" width="230" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="130" y="224" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9.5">data/.session_secret</text>
      <text x="130" y="238" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Zero plaintext stored</text>
    </g>

    <!-- Pillar 2: Dual Brute-Force Rate Limiting -->
    <g transform="translate(290, 0)">
      <rect width="260" height="265" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="260" height="34" rx="10" fill="#451a03"/>
      <text x="130" y="22" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. BRUTE-FORCE DEFENSE</text>

      <text x="18" y="60" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Per-Client Rate Limiter</text>
      <text x="18" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
        <tspan x="18" dy="0">5 failed attempts from an IP</tspan>
        <tspan x="18" dy="15">triggers a 30-second lockout.</tspan>
      </text>

      <text x="18" y="124" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Appliance Global Lockout</text>
      <text x="18" y="141" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
        <tspan x="18" dy="0">10 cumulative failures across</tspan>
        <tspan x="18" dy="15">all IPs locks the whole appliance.</tspan>
      </text>

      <rect x="15" y="196" width="230" height="52" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
      <text x="130" y="217" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Automatic Fail-Closed Lock</text>
      <text x="130" y="235" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Locked until timer expires or CLI reset</text>
    </g>

    <!-- Pillar 3: Emergency Terminal CLI -->
    <g transform="translate(580, 0)">
      <rect width="260" height="265" rx="10" fill="#1e293b" stroke="#15803d" stroke-width="1.5"/>
      <rect width="260" height="34" rx="10" fill="#14532d"/>
      <text x="130" y="22" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. EMERGENCY CLI RECOVERY</text>

      <text x="18" y="60" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Forgotten PIN / Locked Out?</text>
      <text x="18" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">
        <tspan x="18" dy="0">Host terminal access provides</tspan>
        <tspan x="18" dy="15">immediate offline database reset:</tspan>
      </text>

      <rect x="15" y="112" width="230" height="40" rx="6" fill="#052e16" stroke="#15803d" stroke-width="1"/>
      <text x="130" y="137" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">npm run reset-pin</text>

      <text x="18" y="174" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
        <tspan x="18" dy="0">• Prompts for new 4–8 digit PIN</tspan>
        <tspan x="18" dy="18">• Automatically clears lockout timers</tspan>
        <tspan x="18" dy="18">• Updates SQLite with salted PBKDF2</tspan>
        <tspan x="18" dy="18">• Instant access without server reboot</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(60, 425)">
    <rect width="840" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Appliance Access Invariant:</text>
    <text x="25" y="46" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">The display kiosk runs strictly in read-only mode with zero interactive inputs exposed to congregation members.</text>
  </g>
</svg>
